[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doculens-ai"
version = "0.1.1"
description = "AI-powered document intelligence toolkit (experimental)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Alex Chen", email = "alex@doculens.dev"}
]
keywords = ["document-intelligence", "pdf-parsing", "nlp", "information-extraction", "semantic-search", "rag"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "chromadb>=0.4.22",
    "sentence-transformers>=2.5.0",
    "transformers>=4.37.0",
    "torch>=2.1.0",
    "pypdf2>=3.0.0",
    "pdfplumber>=0.10.0",
    "langchain-text-splitters>=0.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "black>=24.0",
    "isort>=5.13",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
]
ocr = [
    "pytesseract>=0.3.10",
    "paddleocr>=2.7.0",
    "pdf2image>=1.16.0",
]

[project.urls]
Homepage = "https://github.com/OxDcz/doculens-ai"
Repository = "https://github.com/OxDcz/doculens-ai.git"
Issues = "https://github.com/OxDcz/doculens-ai/issues"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-v --tb=short"
